<svg xmlns="http://www.w3.org/2000/svg" width="480" height="222" viewBox="0 0 480 222">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&amp;display=swap');
      text { font-family: 'Montserrat', Arial, sans-serif; }
    </style>
  </defs>

  <!--
    LVGL IMPLEMENTATION NOTES:
    - All fonts: lv_font_montserrat_10 / 12 / 14 / 16 (already included)
    - Icons: Unicode glyphs from Montserrat or simple lv_canvas shapes
    - MELODY letters: 7 separate lv_label objects in a row, each with own color
    - LV_LABEL_LONG_CLIP for track name truncation
    - lv_bar for progress + volume
    - All coordinates map directly to lv_obj_set_pos(obj, x, y)
  -->

  <!-- BACKGROUND -->
  <rect width="480" height="222" fill="#000"/>

  <!-- ══════════════════════════════ TOP BAR y=0..21 ══════ -->
  <rect x="0" y="0" width="480" height="22" fill="#0d0d0d"/>
  <line x1="0" y1="22" x2="480" y2="22" stroke="#18FF78" stroke-width="1"/>

  <!-- MELODY — 7x lv_label side by side, Montserrat 11 bold -->
  <!-- MELODY each letter as separate text at precise x, MACHINE separate -->
  <text x="8"  y="15" font-size="11" font-weight="700" fill="#F5FF62">M</text>
  <text x="17" y="15" font-size="11" font-weight="700" fill="#18FF78">E</text>
  <text x="24" y="15" font-size="11" font-weight="700" fill="#FF1732">L</text>
  <text x="30" y="15" font-size="11" font-weight="700" fill="#52FFF1">O</text>
  <text x="39" y="15" font-size="11" font-weight="700" fill="#FF8000">D</text>
  <text x="47" y="15" font-size="11" font-weight="700" fill="#5AFF3D">Y</text>
  <text x="57" y="15" font-size="11" font-weight="700" fill="#ffffff">MACHINE</text>

  <!-- folder glyph (▶ as folder substitute) + path — lv_label -->
  <text x="192" y="15" fill="#333" font-size="9">/MP3</text>

  <!-- battery: lv_label "75%" + lv_obj rect outline + lv_obj fill -->
  <text x="424" y="15" fill="#444" font-size="9" text-anchor="end">75%</text>
  <rect x="426" y="5"  width="28" height="12" rx="1" fill="none" stroke="#444" stroke-width="1"/>
  <rect x="454" y="8"  width="3"  height="6"  rx="1" fill="#444"/>
  <rect x="428" y="7"  width="20" height="8"         fill="#18FF78"/>

  <!-- ══════════════════════════ VOLUME BAR x=0..5 ════════ -->
  <!-- lv_bar vertical, range 0..100, value=70 -->
  <rect x="0" y="23" width="5" height="181" fill="#111"/>
  <rect x="0" y="77" width="5" height="127" fill="#FF8000"/>

  <!-- ══════════════════════════ DIVIDER x=300 ════════════ -->
  <line x1="300" y1="22" x2="300" y2="204" stroke="#1c1c1c" stroke-width="1"/>

  <!-- ══════════════════════════ LEFT PANEL ═══════════════ -->

  <!-- ZONE 1: track name y=23..65 -->
  <!-- lv_label Montserrat 14 bold, LV_LABEL_LONG_CLIP, w=278 -->
  <text x="152" y="38" fill="#F5FF62" font-size="14" font-weight="700" text-anchor="middle">Synthwave Dreams Vol.3</text>
  <!-- lv_label Montserrat 10, color #2e2e2e -->
  <text x="152" y="52" fill="#2e2e2e" font-size="10" text-anchor="middle">track 04 of 18</text>

  <!-- ZONE 2: progress bar y=65..94 -->
  <!-- lv_bar w=278 h=3, bg=#1a1a1a, indicator=#18FF78 -->
  <rect x="14" y="67" width="278" height="3" rx="1" fill="#1a1a1a"/>
  <rect x="14" y="67" width="112" height="3" rx="1" fill="#18FF78"/>
  <!-- lv_label Montserrat 10 -->
  <text x="14"  y="82" fill="#2e2e2e" font-size="9">1:43</text>
  <text x="292" y="82" fill="#2e2e2e" font-size="9" text-anchor="end">4:12</text>

  <!-- separator: lv_obj h=1 bg=#141414 -->
  <line x1="14" y1="90" x2="290" y2="90" stroke="#141414" stroke-width="1"/>

  <!-- ZONE 3: state row y=91..120 center=105 -->
  <!-- all lv_label Montserrat 10, inline row via lv_obj_set_pos -->
  <text x="14"  y="109" fill="#FF8000" font-size="9" dominant-baseline="middle">VOL 70%</text>
  <text x="58"  y="109" fill="#1e1e1e" font-size="9" dominant-baseline="middle">|</text>
  <text x="65"  y="109" fill="#18FF78" font-size="9" dominant-baseline="middle">&#x25B6; playing</text>
  <text x="118" y="109" fill="#1e1e1e" font-size="9" dominant-baseline="middle">|</text>
  <!-- RPT badge: lv_obj border=#252525 + lv_label -->
  <rect x="126" y="103" width="30" height="12" rx="2" fill="#0d0d0d" stroke="#252525" stroke-width="1"/>
  <text x="141" y="109" fill="#333" font-size="9" text-anchor="middle" dominant-baseline="middle">RPT</text>
  <text x="160" y="109" fill="#1e1e1e" font-size="9" dominant-baseline="middle">|</text>
  <!-- SHF badge active: lv_obj border=#F5FF62 -->
  <rect x="167" y="103" width="30" height="12" rx="2" fill="#0c0c00" stroke="#F5FF62" stroke-width="1"/>
  <text x="182" y="109" fill="#F5FF62" font-size="9" text-anchor="middle" dominant-baseline="middle">SHF</text>

  <!-- separator -->
  <line x1="14" y1="121" x2="290" y2="121" stroke="#141414" stroke-width="1"/>

  <!-- ZONE 4+5: controls y=122..203 -->
  <!-- lv_label Montserrat 10, color #2a2a2a -->
  <text x="14" y="133" fill="#2a2a2a" font-size="9">controls</text>

  <!-- col1: x=14 key #383838, x=62 action #1c1c1c -->
  <!-- col2: x=148 key #383838, x=185 action #1c1c1c -->
  <text x="14"  y="148" fill="#383838" font-size="9">[Q][A]</text>
  <text x="62"  y="148" fill="#1c1c1c" font-size="9">vol +/-</text>
  <text x="148" y="148" fill="#383838" font-size="9">[W][D]</text>
  <text x="185" y="148" fill="#1c1c1c" font-size="9">prev/next</text>

  <text x="14"  y="163" fill="#383838" font-size="9">[SPC]</text>
  <text x="62"  y="163" fill="#1c1c1c" font-size="9">pause</text>
  <text x="148" y="163" fill="#383838" font-size="9">[B]</text>
  <text x="185" y="163" fill="#1c1c1c" font-size="9">stop</text>

  <text x="14"  y="178" fill="#383838" font-size="9">[R]</text>
  <text x="62"  y="178" fill="#1c1c1c" font-size="9">repeat</text>
  <text x="148" y="178" fill="#383838" font-size="9">[H]</text>
  <text x="185" y="178" fill="#1c1c1c" font-size="9">shuffle</text>

  <text x="14"  y="193" fill="#383838" font-size="9">[S]</text>
  <text x="62"  y="193" fill="#1c1c1c" font-size="9">settings</text>
  <text x="148" y="193" fill="#383838" font-size="9">[rot]</text>
  <text x="185" y="193" fill="#1c1c1c" font-size="9">play/scroll</text>

  <!-- ══════════════════════════ RIGHT PANEL ═══════════════ -->
  <rect x="301" y="22" width="179" height="182" fill="#040404"/>

  <!-- header h=16: lv_obj bg=#080808 + lv_label -->
  <rect x="301" y="22" width="179" height="16" fill="#080808"/>
  <line x1="301" y1="38" x2="479" y2="38" stroke="#181818" stroke-width="1"/>
  <text x="310" y="33" fill="#2e2e2e" font-size="9">PLAYLIST</text>
  <text x="474" y="33" fill="#1e1e1e" font-size="9" text-anchor="end">18 tracks</text>

  <!-- rows: y0=38 rowH=20, baseline=y0+14 -->
  <!-- inactive: bg=#040404, num=#1e1e1e, name=#252525 -->
  <rect x="301" y="38"  width="179" height="20" fill="#040404"/>
  <text x="308" y="52"  fill="#1e1e1e" font-size="9">01</text>
  <text x="323" y="52"  fill="#252525" font-size="9">Intro Sequence</text>

  <rect x="301" y="58"  width="179" height="20" fill="#040404"/>
  <text x="308" y="72"  fill="#1e1e1e" font-size="9">02</text>
  <text x="323" y="72"  fill="#252525" font-size="9">Neon Horizon</text>

  <rect x="301" y="78"  width="179" height="20" fill="#040404"/>
  <text x="308" y="92"  fill="#1e1e1e" font-size="9">03</text>
  <text x="323" y="92"  fill="#252525" font-size="9">Chrome City</text>

  <!-- playing row: bg=#040f04, left accent bar w=2 #18FF78, text #18FF78 -->
  <rect x="301" y="98"  width="179" height="20" fill="#040f04"/>
  <rect x="301" y="98"  width="2"   height="20" fill="#18FF78"/>
  <text x="308" y="112" fill="#18FF78" font-size="9">&#x25B6;</text>
  <text x="320" y="112" fill="#18FF78" font-size="9">Synthwave Dreams V3</text>

  <!-- cursor row: bg=#0b0b00, border=#F5FF62 1px, text #888 -->
  <rect x="301" y="118" width="179" height="20" fill="#0b0b00"/>
  <rect x="301" y="118" width="179" height="20" fill="none" stroke="#F5FF62" stroke-width="1"/>
  <text x="308" y="132" fill="#555" font-size="9">05</text>
  <text x="323" y="132" fill="#888" font-size="9">Digital Rain</text>

  <rect x="301" y="138" width="179" height="20" fill="#040404"/>
  <text x="308" y="152" fill="#1e1e1e" font-size="9">06</text>
  <text x="323" y="152" fill="#252525" font-size="9">Retrograde</text>

  <rect x="301" y="158" width="179" height="20" fill="#040404"/>
  <text x="308" y="172" fill="#1e1e1e" font-size="9">07</text>
  <text x="323" y="172" fill="#252525" font-size="9">Laser Grid</text>

  <rect x="301" y="178" width="179" height="20" fill="#040404"/>
  <text x="308" y="192" fill="#1e1e1e" font-size="9">08</text>
  <text x="323" y="192" fill="#252525" font-size="9">Outrun Forever</text>

  <!-- ══════════════════════════ BOTTOM BAR y=204..221 ═════ -->
  <line x1="0" y1="204" x2="480" y2="204" stroke="#18FF78" stroke-width="1"/>
  <rect x="0" y="205" width="480" height="17" fill="#040404"/>
  <text x="14"  y="216" fill="#1a1a1a" font-size="8">MP3 · 44.1kHz · 320kbps</text>
  <text x="240" y="216" fill="#141414" font-size="8" text-anchor="middle">click rotary to play selected</text>
  <text y="216" font-size="9" font-weight="700">
    <tspan x="330" fill="#F5FF62">/</tspan>
    <tspan fill="#18FF78">/</tspan>
    <tspan fill="#FF1732">/</tspan>
    <tspan fill="#52FFF1">/</tspan>
    <tspan fill="#FF8000">/</tspan>
    <tspan fill="#5AFF3D">/</tspan>
    <tspan fill="#F5FF62">/</tspan>
    <tspan fill="#18FF78">/</tspan>
    <tspan fill="#FF1732">/</tspan>
    <tspan fill="#52FFF1">/</tspan>
    <tspan fill="#FF8000">/</tspan>
    <tspan fill="#5AFF3D">/</tspan>
    <tspan fill="#F5FF62">/</tspan>
    <tspan fill="#18FF78">/</tspan>
    <tspan fill="#FF1732">/</tspan>
    <tspan fill="#52FFF1">/</tspan>
    <tspan fill="#FF8000">/</tspan>
    <tspan fill="#5AFF3D">/</tspan>
    <tspan fill="#F5FF62">/</tspan>
    <tspan fill="#18FF78">/</tspan>
    <tspan fill="#FF1732">/</tspan>
    <tspan fill="#52FFF1">/</tspan>
    <tspan fill="#FF8000">/</tspan>
    <tspan fill="#5AFF3D">/</tspan>
  </text>

</svg>
